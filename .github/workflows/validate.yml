name: Validate Buen Bocado

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - release/buen-bocado-visual-refresh

permissions:
  contents: read

concurrency:
  group: buen-bocado-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun run test --passWithNoTests

      - name: Production build
        run: bun run build
